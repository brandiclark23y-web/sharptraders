<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - EA Marketplace</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>
    <nav class="navbar">
        <div class="container navbar-container">
            <div class="navbar-brand">
                <a href="../index.html" class="flex items-center gap-2">
                    <div class="navbar-logo">EA</div>
                    <span class="navbar-brand-text">Admin Panel</span>
                </a>
            </div>
        </div>
    </nav>

    <section class="hero" style="padding-top:100px;padding-bottom:60px;">
        <div class="container">
            <div class="card" style="max-width:400px;margin:0 auto;">
                <div class="card-body">
                    <h2 class="text-center mb-4">Admin Login</h2>
                    <form onsubmit="handleAdminLogin(event)">
                        <div class="form-group">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-input" id="adminEmail" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-input" id="adminPassword" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Login</button>
                    </form>
                    <p class="text-center mt-4 text-sm text-muted">
                        Demo: admin@eamarket.com / admin123
                    </p>
                </div>
            </div>
        </div>
    </section>

    <script src="../js/data.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/app.js"></script>
    
    <script>
        function handleAdminLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            
            const result = App.loginAdmin(email, password);
            
            if (result.success) {
                showToast('Admin login successful!', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                showToast('Invalid admin credentials', 'error');
            }
        }
    </script>
</body>
</html>
