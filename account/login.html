<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EA Marketplace</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>
    <nav class="navbar">
        <div class="container navbar-container">
            <div class="navbar-brand">
                <a href="../index.html" class="flex items-center gap-2">
                    <div class="navbar-logo">EA</div>
                    <span class="navbar-brand-text">EAMarket</span>
                </a>
            </div>
            <div class="navbar-actions">
                <a href="../eas.html" class="btn btn-ghost btn-sm">Back to Store</a>
            </div>
        </div>
    </nav>

    <section class="hero" style="padding-top:100px;padding-bottom:60px;">
        <div class="container">
            <div class="card" style="max-width:400px;margin:0 auto;">
                <div class="card-body">
                    <h2 class="text-center mb-4">Sign In</h2>
                    <form onsubmit="handleLogin(event)">
                        <div class="form-group">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-input" id="loginEmail" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-input" id="loginPassword" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
                    </form>
                    <p class="text-center mt-4">
                        Don't have an account? <a href="register.html">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </section>

    <script src="../js/data.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/app.js"></script>
    
    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            const result = App.loginUser(email, password);
            
            if (result.success) {
                showToast('Login successful!', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                showToast('Invalid credentials. Try demo@example.com / demo123', 'error');
            }
        }
    </script>
</body>
</html>
